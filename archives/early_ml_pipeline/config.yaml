# ═══════════════════════════════════════════════════════════════
# 🎯 PRODUCTION ML PIPELINE v2 — Configuration
# NIFTY50 Intraday Alpha Signal System
# Focus: Signal quality, regime awareness, PnL optimization
# Memory-Optimized for 8GB RAM
# ═══════════════════════════════════════════════════════════════

# ===== 📁 PATHS =====
data:
  raw: "nifty50_5min_5years.csv"
  processed: "data/processed_v2.parquet"
  model_dir: "models/"
  log_dir: "logs/"
  results_dir: "results/"

# ===== 🏗️ TARGET ENGINEERING =====
target:
  lookahead: 3             # Predict next 15 minutes (3 × 5-min candles)
  threshold: 0.004         # 0.4% move for label=1
  use_smooth_target: true  # Penalize choppy paths (direction consistency check)
  path_consistency_bars: 3 # Among the N lookahead bars, majority must be up

# ===== 🔁 TRAINING & VALIDATION =====
training:
  train_ratio: 0.8
  random_state: 42
  validation_strategy: "walk_forward"
  n_splits: 3              # Reduced for RAM efficiency
  purge_gap: 6
  use_sampling: true       # ENABLED for 8GB RAM machines
  sample_ratio: 0.5        # Use 50% of data for training
  num_boost_round: 1000
  early_stopping_rounds: 50
  use_scale_pos_weight: true

# ===== 🧠 MODEL (LightGBM) =====
model:
  type: "lightgbm"
  params:
    objective: "binary"
    metric: "auc"
    boosting_type: "gbdt"
    num_leaves: 63           # Reduced from 127
    learning_rate: 0.015
    feature_fraction: 0.6
    bagging_fraction: 0.6
    bagging_freq: 5
    min_child_samples: 200
    min_child_weight: 10.0
    reg_alpha: 0.5
    reg_lambda: 5.0
    max_depth: 7
    verbose: -1
    n_jobs: -1

# ===== 🎭 ENSEMBLE =====
# Disabled for memory optimization in training fold loops
ensemble:
  enabled: false

# ===== 🧠 META-MODEL (LAYER 2) =====
meta_model:
  enabled: true
  candidate_threshold: 0.45
  n_estimators: 200
  max_depth: 6
  min_samples_leaf: 50
  n_splits: 3
  model_path: "models/meta_model.joblib"

# ===== ⚡ FEATURE ENGINEERING =====
features:
  rolling_windows: [5, 10, 20]
  return_windows: [1, 3, 5, 10]
  momentum_windows: [3, 5, 10]
  lags: [1, 2, 3]
  use_market_cross_sectional: true
  use_interaction_features: false # Disabled to save memory
  use_volume_intelligence: true
  use_time_features: true
  use_regime_features: true
  use_persistence_features: true
  use_cross_sectional_ranks: true

# ===== 🌊 REGIME DETECTION =====
regime:
  volatility_lookback: 20
  trend_lookback: 20
  vol_expansion_threshold: 1.5
  trend_adx_length: 14

# ===== 🔧 FEATURE SELECTION =====
feature_selection:
  enabled: true
  correlation_threshold: 0.92
  min_importance_pct: 0.5
  max_features: 40

# ===== 📊 THRESHOLD OPTIMIZATION =====
threshold_optimization:
  sweep_range:
    start: 0.50
    stop: 0.90
    step: 0.02
  target_min_precision: 0.50
  target_min_trades: 40
  optimize_for: "profit_factor"

# ===== 🎛️ SIGNAL FILTERING =====
signal_filtering:
  top_n_per_timestamp: 2
  min_confidence: 0.60
  meta_threshold: 0.70
  min_relative_strength: 0.002
  min_time_gap_minutes: 15
  use_stability_filter: true
  stability_lag_threshold: 0.58
  max_signals_per_day: 10
  regime_gate: true
  exclude_open_close: true

# ===== 📈 COSTS =====
costs:
  brokerage_pct: 0.0002
  slippage_pct: 0.0003
  total_round_trip: 0.001
